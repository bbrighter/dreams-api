definitions:
  entity.Categories:
    items:
      $ref: '#/definitions/entity.Category'
    type: array
  entity.CategoriesResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/entity.CategoryResponse'
        type: array
      persons:
        items:
          $ref: '#/definitions/entity.CategoryResponse'
        type: array
    type: object
  entity.Category:
    properties:
      dreams:
        items:
          $ref: '#/definitions/entity.Dream'
        type: array
      id:
        type: integer
      name:
        type: string
      type:
        $ref: '#/definitions/entity.CategoryType'
    type: object
  entity.CategoryResponse:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  entity.CategoryType:
    enum:
    - person
    - category
    type: string
    x-enum-varnames:
    - TypePerson
    - TypeCategory
  entity.CountResponse:
    properties:
      count:
        type: integer
      id:
        type: integer
    required:
    - count
    - id
    type: object
  entity.CountsResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/entity.CountResponse'
        type: array
      persons:
        items:
          $ref: '#/definitions/entity.CountResponse'
        type: array
    required:
    - categories
    - persons
    type: object
  entity.Dream:
    properties:
      categories:
        $ref: '#/definitions/entity.Categories'
      date:
        type: string
      description:
        type: string
      finalized:
        type: boolean
      id:
        type: integer
      rating:
        type: integer
      visible:
        type: boolean
    type: object
  entity.DreamMetaResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/entity.CategoryResponse'
        type: array
      date:
        type: string
      finalized:
        type: boolean
      id:
        type: integer
      persons:
        items:
          $ref: '#/definitions/entity.CategoryResponse'
        type: array
      rating:
        type: integer
      visible:
        type: boolean
    required:
    - date
    - finalized
    - id
    - visible
    type: object
  entity.DreamResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/entity.CategoryResponse'
        type: array
      date:
        type: string
      description:
        type: string
      finalized:
        type: boolean
      id:
        type: integer
      persons:
        items:
          $ref: '#/definitions/entity.CategoryResponse'
        type: array
      rating:
        type: integer
      visible:
        type: boolean
    required:
    - date
    - description
    - finalized
    - id
    - visible
    type: object
  entity.DreamsResponse:
    properties:
      dreams:
        items:
          $ref: '#/definitions/entity.DreamMetaResponse'
        type: array
    required:
    - dreams
    type: object
  entity.LoginResponse:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  v1.LoginRequest:
    properties:
      name:
        type: string
      password:
        type: string
    required:
    - name
    - password
    type: object
  v1.MergeCategoriesParams:
    properties:
      newName:
        type: string
      sourceCategoryId:
        type: integer
      targetCategoryId:
        type: integer
    required:
    - newName
    - sourceCategoryId
    - targetCategoryId
    type: object
  v1.PostDreamRequest:
    properties:
      date:
        type: string
      description:
        type: string
    required:
    - date
    type: object
  v1.UpdateDreamRequest:
    properties:
      date:
        type: string
      description:
        type: string
      rating:
        type: integer
    type: object
info:
  contact: {}
paths:
  /categories:
    get:
      description: Get all categories
      parameters:
      - description: 'Comma separated list of child objects. Possible entries: dreamsCount'
        in: query
        name: includes
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.CategoriesResponse'
  /categories/:id:
    delete:
      description: Delete a category. Must be contained in no dreams.
      produces:
      - application/json
      responses:
        "200":
          description: OK
    patch:
      description: Change the type of a category.
      parameters:
      - description: New type for this category
        in: query
        name: newType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
  /categories/merge:
    post:
      description: Merge two categories.
      parameters:
      - description: Which categories should be merged
        in: body
        name: mergeCategoriesParams
        required: true
        schema:
          $ref: '#/definitions/v1.MergeCategoriesParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Category'
            type: array
  /dreams:
    get:
      description: Get all dreams
      parameters:
      - description: 'Comma separated list of child objects. Possible entries: categories,
          persons'
        in: query
        name: includes
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of all dreams
          schema:
            $ref: '#/definitions/entity.DreamsResponse'
    post:
      consumes:
      - application/json
      description: Create a new dream
      parameters:
      - description: The dream which will be created
        in: body
        name: postDreamRequest
        required: true
        schema:
          $ref: '#/definitions/v1.PostDreamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: number
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
  /dreams/{dreamId}:
    delete:
      description: Delete one dreams
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
        "404":
          description: Not Found
    get:
      description: Get one dream
      produces:
      - application/json
      responses:
        "200":
          description: One dream
          schema:
            $ref: '#/definitions/entity.DreamResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
    patch:
      consumes:
      - application/json
      description: Update an existing dream
      parameters:
      - description: All parameters of the dream that should be updated
        in: body
        name: updateDreamRequest
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateDreamRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/categories:
    put:
      description: Add a category to a dream
      parameters:
      - description: Name of a category
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.CategoriesResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/categories/{categoryId}:
    delete:
      description: Remove a category from a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.CategoriesResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/finalize:
    patch:
      description: Finalize a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/persons:
    put:
      description: Add a person to a dream
      parameters:
      - description: Name of person
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.CategoriesResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/persons/{personId}:
    delete:
      description: Delete a person from a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.CategoriesResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/private:
    get:
      description: Get all dreams - including private
      produces:
      - application/json
      responses:
        "200":
          description: List of all dreams
          schema:
            $ref: '#/definitions/entity.DreamsResponse'
      security:
      - BasicAuth: []
  /dreams/private/{dreamId}:
    get:
      description: Get one private dream
      produces:
      - application/json
      responses:
        "200":
          description: One dream
          schema:
            $ref: '#/definitions/entity.DreamResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
      security:
      - BasicAuth: []
    patch:
      description: Toggle visibility of a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BasicAuth: []
  /login:
    post:
      description: Login
      parameters:
      - description: Password and user name
        in: body
        name: loginRequest
        required: true
        schema:
          $ref: '#/definitions/v1.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.LoginResponse'
        "400":
          description: Bad Request
  /logout:
    post:
      description: Logout
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
  /private/statistics:
    get:
      description: Get count per category and person
      parameters:
      - description: Limit of returned results
        in: query
        name: limit
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: Counts by category and persons
          schema:
            $ref: '#/definitions/entity.CountsResponse'
      security:
      - BasicAuth: []
  /statistics:
    get:
      description: Get count per category and person
      parameters:
      - description: Limit of returned results
        in: query
        name: limit
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: Counts by category and persons
          schema:
            $ref: '#/definitions/entity.CountsResponse'
swagger: "2.0"
