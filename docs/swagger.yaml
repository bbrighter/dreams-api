definitions:
  controller.CategoryListResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/controller.CategoryResponse'
        type: array
    required:
    - categories
    type: object
  controller.CategoryResponse:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
      type:
        type: string
    required:
    - id
    - name
    - type
    type: object
  controller.CountByCat:
    properties:
      categoryId:
        type: integer
      count:
        type: integer
    required:
    - categoryId
    - count
    type: object
  controller.DreamListResponse:
    properties:
      dreams:
        items:
          $ref: '#/definitions/controller.DreamResponse'
        type: array
    required:
    - dreams
    type: object
  controller.DreamResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/controller.CategoryResponse'
        type: array
      date:
        type: string
      description:
        type: string
      finalized:
        type: boolean
      id:
        type: integer
      rating:
        type: integer
    required:
    - categories
    - date
    - description
    - finalized
    - id
    type: object
  controller.MergeCategoriesParams:
    properties:
      newName:
        type: string
      sourceCategoryId:
        type: integer
      targetCategoryId:
        type: integer
    required:
    - newName
    - sourceCategoryId
    - targetCategoryId
    type: object
  controller.PostCategoryRequestBody:
    properties:
      categoryType:
        type: string
      name:
        type: string
    required:
    - categoryType
    - name
    type: object
  controller.PostDreamRequest:
    properties:
      date:
        type: string
      description:
        type: string
    required:
    - date
    - description
    type: object
  controller.Statistic:
    properties:
      categories:
        items:
          $ref: '#/definitions/controller.CountByCat'
        type: array
      dreamCount:
        type: integer
      month:
        type: string
    required:
    - categories
    - dreamCount
    - month
    type: object
  controller.Statistics:
    properties:
      statistics:
        items:
          $ref: '#/definitions/controller.Statistic'
        type: array
    required:
    - statistics
    type: object
  controller.UpdateDreamRequest:
    properties:
      date:
        type: string
      description:
        type: string
      rating:
        type: integer
    type: object
info:
  contact: {}
paths:
  /categories:
    get:
      description: Get all categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.CategoryListResponse'
  /categories/:id:
    delete:
      description: Delete a category. Must be contained in no dreams.
      produces:
      - application/json
      responses:
        "200":
          description: OK
  /categories/:id/name:
    patch:
      description: Change the name of a category.
      parameters:
      - description: New name for this category
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
  /categories/:id/type:
    patch:
      description: Change the type of a category.
      parameters:
      - description: New type for this category
        in: query
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
  /categories/merge:
    post:
      description: Merge two categories.
      parameters:
      - description: Which categories should be merged
        in: body
        name: mergeCategoriesParams
        required: true
        schema:
          $ref: '#/definitions/controller.MergeCategoriesParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.CategoryListResponse'
  /count-categories:
    get:
      description: Get count per category and person
      produces:
      - application/json
      responses:
        "200":
          description: Counts by category and persons
          schema:
            $ref: '#/definitions/controller.CategoryListResponse'
  /count-categories/monthly:
    get:
      description: Get count per month
      produces:
      - application/json
      responses:
        "200":
          description: Monthly statistics
          schema:
            $ref: '#/definitions/controller.Statistics'
  /dreams:
    get:
      description: Get all dreams
      produces:
      - application/json
      responses:
        "200":
          description: List of all dreams
          schema:
            $ref: '#/definitions/controller.DreamListResponse'
    post:
      consumes:
      - application/json
      description: Create a new dream
      parameters:
      - description: The dream which will be created
        in: body
        name: postDreamRequest
        required: true
        schema:
          $ref: '#/definitions/controller.PostDreamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: number
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
  /dreams/{dreamId}:
    delete:
      description: Delete one dreams
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
        "404":
          description: Not Found
    get:
      description: Get one dream
      produces:
      - application/json
      responses:
        "200":
          description: One dream
          schema:
            $ref: '#/definitions/controller.DreamResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
    patch:
      consumes:
      - application/json
      description: Update an existing dream
      parameters:
      - description: All parameters of the dream that should be updated
        in: body
        name: updateDreamRequest
        required: true
        schema:
          $ref: '#/definitions/controller.UpdateDreamRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/categories:
    post:
      description: Add a new person or category to a dream
      parameters:
      - description: 'Name and category. Allowed values for ''category'' are: ''person'',
          ''category'''
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/controller.PostCategoryRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: number
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/categories/{categoryId}:
    delete:
      description: Delete a category or person from a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
    put:
      description: Add an exiting person or category to a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/finalize:
    patch:
      description: Finalize a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
swagger: "2.0"
