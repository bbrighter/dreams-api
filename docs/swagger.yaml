definitions:
  controller.CategoriesResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/controller.CategoryResponse'
        type: array
    required:
    - categories
    type: object
  controller.CategoryResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  controller.Count:
    properties:
      count:
        type: integer
      id:
        type: integer
    required:
    - count
    - id
    type: object
  controller.CountsResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/controller.Count'
        type: array
      persons:
        items:
          $ref: '#/definitions/controller.Count'
        type: array
    required:
    - categories
    - persons
    type: object
  controller.DreamMetaResponse:
    properties:
      date:
        type: string
      id:
        type: integer
      visible:
        type: boolean
    required:
    - date
    - id
    - visible
    type: object
  controller.DreamRequestBody:
    properties:
      date:
        type: string
      description:
        type: string
    required:
    - date
    type: object
  controller.DreamResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/controller.CategoryResponse'
        type: array
      date:
        type: string
      description:
        type: string
      id:
        type: integer
      persons:
        items:
          $ref: '#/definitions/controller.PersonResponse'
        type: array
      visible:
        type: boolean
    required:
    - categories
    - date
    - description
    - id
    - persons
    - visible
    type: object
  controller.DreamsResponse:
    properties:
      dreams:
        items:
          $ref: '#/definitions/controller.DreamMetaResponse'
        type: array
    required:
    - dreams
    type: object
  controller.PersonResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  controller.PersonsResponse:
    properties:
      persons:
        items:
          $ref: '#/definitions/controller.PersonResponse'
        type: array
    required:
    - persons
    type: object
info:
  contact: {}
paths:
  /categories:
    get:
      description: Get all categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.CategoriesResponse'
  /dreams:
    get:
      description: Get all dreams
      produces:
      - application/json
      responses:
        "200":
          description: List of all dreams
          schema:
            $ref: '#/definitions/controller.DreamsResponse'
    post:
      consumes:
      - application/json
      description: Create a new dream
      parameters:
      - description: The dream which will be created
        in: body
        name: dreamRequestBody
        required: true
        schema:
          $ref: '#/definitions/controller.DreamRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: number
        "400":
          description: Bad Request
  /dreams/{dreamId}:
    delete:
      description: Delete one dreams
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
        "404":
          description: Not Found
    get:
      description: Get one dream
      produces:
      - application/json
      responses:
        "200":
          description: One dream
          schema:
            $ref: '#/definitions/controller.DreamResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
    patch:
      consumes:
      - application/json
      description: Update an existing dream
      parameters:
      - description: The dream which will be updated
        in: body
        name: dreamRequestBody
        required: true
        schema:
          $ref: '#/definitions/controller.DreamRequestBody'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/categories:
    put:
      description: Add a category to a dream
      parameters:
      - description: Name of a category
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.CategoriesResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/categories/{categoryId}:
    delete:
      description: Remove a category from a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.CategoriesResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/persons:
    put:
      description: Add a person to a dream
      parameters:
      - description: Name of person
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: number
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /dreams/{dreamId}/persons/{personId}:
    delete:
      description: Delete a person from a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.PersonsResponse'
        "400":
          description: Bad Request
        "404":
          description: Not Found
  /persons:
    get:
      description: Get all persons
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controller.PersonResponse'
            type: array
  /private/dreams:
    get:
      description: Get all private dreams
      parameters:
      - description: Basic Username:password
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of all dreams
          schema:
            $ref: '#/definitions/controller.DreamsResponse'
        "401":
          description: Unauthorized
      security:
      - BasicAuth: []
  /private/dreams/{dreamId}:
    get:
      description: Get one private dream
      produces:
      - application/json
      responses:
        "200":
          description: One dream
          schema:
            $ref: '#/definitions/controller.DreamResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      security:
      - BasicAuth: []
    patch:
      description: Toggle visiblity of a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: boolean
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "404":
          description: Not Found
      security:
      - BasicAuth: []
  /private/statistics:
    get:
      description: Get count per category and person
      produces:
      - application/json
      responses:
        "200":
          description: Counts by category and persons
          schema:
            $ref: '#/definitions/controller.CountsResponse'
        "401":
          description: Unauthorized
      security:
      - BasicAuth: []
  /statistics:
    get:
      description: Get count per category and person
      produces:
      - application/json
      responses:
        "200":
          description: Counts by category and persons
          schema:
            $ref: '#/definitions/controller.CountsResponse'
swagger: "2.0"
