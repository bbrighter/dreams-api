definitions:
  controller.CategoriesResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/controller.CategoryResponse'
        type: array
    required:
    - categories
    type: object
  controller.CategoryCount:
    properties:
      categoryId:
        type: integer
      count:
        type: integer
    required:
    - categoryId
    - count
    type: object
  controller.CategoryCountResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/controller.CategoryCount'
        type: array
    required:
    - categories
    type: object
  controller.CategoryResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  controller.DreamMetaResponse:
    properties:
      date:
        type: string
      id:
        type: integer
    required:
    - date
    - id
    type: object
  controller.DreamRequestBody:
    properties:
      date:
        type: string
      description:
        type: string
    required:
    - date
    type: object
  controller.DreamResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/controller.CategoryResponse'
        type: array
      date:
        type: string
      description:
        type: string
      id:
        type: integer
      persons:
        items:
          $ref: '#/definitions/controller.PersonResponse'
        type: array
    required:
    - categories
    - date
    - description
    - id
    - persons
    type: object
  controller.DreamsResponse:
    properties:
      dreams:
        items:
          $ref: '#/definitions/controller.DreamMetaResponse'
        type: array
    required:
    - dreams
    type: object
  controller.PersonResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  controller.PersonsResponse:
    properties:
      persons:
        items:
          $ref: '#/definitions/controller.PersonResponse'
        type: array
    required:
    - persons
    type: object
info:
  contact: {}
paths:
  /categories:
    get:
      description: Get all categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.CategoriesResponse'
  /dreams:
    get:
      description: Get all dreams
      produces:
      - application/json
      responses:
        "200":
          description: List of all dreams
          schema:
            $ref: '#/definitions/controller.DreamsResponse'
    post:
      consumes:
      - application/json
      description: Create a new dream
      parameters:
      - description: The dream which will be created
        in: body
        name: dreamRequestBody
        required: true
        schema:
          $ref: '#/definitions/controller.DreamRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: number
  /dreams/{dreamId}:
    delete:
      description: Delete one dreams
      produces:
      - application/json
      responses:
        "200":
          description: OK
    get:
      description: Get one dream
      produces:
      - application/json
      responses:
        "200":
          description: One dream
          schema:
            $ref: '#/definitions/controller.DreamResponse'
    patch:
      consumes:
      - application/json
      description: Update an existing dream
      parameters:
      - description: The dream which will be updated
        in: body
        name: dreamRequestBody
        required: true
        schema:
          $ref: '#/definitions/controller.DreamRequestBody'
      responses:
        "200":
          description: OK
  /dreams/{dreamId}/categories:
    put:
      description: Add a category to a dream
      parameters:
      - description: Name of a category
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.CategoriesResponse'
  /dreams/{dreamId}/categories/{categoryId}:
    delete:
      description: Remove a category from a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.CategoriesResponse'
  /dreams/{dreamId}/persons:
    put:
      description: Add a person to a dream
      parameters:
      - description: Name of person
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: number
  /dreams/{dreamId}/persons/{personId}:
    delete:
      description: Delete a person from a dream
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.PersonsResponse'
  /persons:
    get:
      description: Get all persons
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controller.PersonResponse'
            type: array
  /statistics:
    get:
      description: Get count per category
      produces:
      - application/json
      responses:
        "200":
          description: Count by categoryId
          schema:
            $ref: '#/definitions/controller.CategoryCountResponse'
swagger: "2.0"
